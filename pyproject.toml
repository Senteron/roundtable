[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "roundtable"
version = "0.5.1"
description = "MCP tool for multi-model deliberation. Claude consults a panel of other models, refines its own answer through iterative critique."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [
    { name = "Tom Yackel" }
]
keywords = ["mcp", "llm", "multi-model", "claude", "deliberation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    # Provider clients
    "anthropic>=0.40",
    # >=3: from 3.0 the SDK transport is httpx2, and the provider unit
    # tests inject an httpx2 mock through the `http_client=` seam, so
    # a 2.x client would not be what the tests exercise.
    # <4: 3.0 swapped the transport under us; take the next major
    # deliberately rather than on a fresh resolve.
    "openai>=3,<4",
    "google-genai>=0.3",
    # MCP server
    # <2: mcp 2.0 removed the low-level `Server.list_tools()` /
    # `call_tool()` decorator API this server is built on; a fresh
    # resolve crashes at startup with AttributeError. Lift once the
    # server is ported to the 2.x API (CHANGELOG 0.5.0 Notes).
    "mcp>=0.9,<2",
    # Async HTTP for any direct-call providers
    "httpx>=0.27",
    # Config / env loading
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    # Direct import in tests/unit/test_providers (mock transport for
    # the openai SDK); also a transitive dep of openai>=3.
    "httpx2>=2.7",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/Senteron/roundtable"
Repository = "https://github.com/Senteron/roundtable"
Issues = "https://github.com/Senteron/roundtable/issues"

[tool.setuptools.packages.find]
include = ["roundtable*"]
exclude = ["tests*", "docs*", "scripts*", "mcpb*", "dist*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Pin the rule set explicitly. ruff 0.16 widened its defaults (B, SIM,
# I, UP, ...) and uv.lock is gitignored, so CI resolves the newest ruff;
# without this the lint step fails on code that has passed since v0.1.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live: maintainer smoke check against real provider APIs (D8). Requires OPENAI_API_KEY, GOOGLE_API_KEY, DEEPSEEK_API_KEY in the environment. NOT run in CI; not a release gate.",
]
